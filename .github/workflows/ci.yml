name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Node 22 is the engines floor; Windows exercises the platform
        # branches in the install smoke and stdio spawning.
        os: [ubuntu-latest, windows-latest]
        node: ["22.12", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
